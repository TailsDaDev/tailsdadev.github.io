<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TailsPlaysBloxd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #25a5e6;
    --blue-deep: #1b7fc4;
    --blue-edge: #3aa0e8;
    --ink: #0b1f33;
    --title: #4fc3f7;
    --sky: #c9d8e4;
    --grass: #9bbf4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: "VT323", "Courier New", monospace;
    color: var(--ink);
    background: url("images/bg.png") center / cover no-repeat fixed;
    min-height: 100vh;
  }

  .page {
    max-width: 1280px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: 1fr minmax(0, 1.3fr) 1fr;
    grid-template-areas:
      "p1 hero p2"
      "p3 hero p4";
    column-gap: 2.5rem;
    row-gap: 2rem;
    align-items: center;
  }

  /* ---------- Project cards ---------- */
  .project {
    display: block;
    transition: transform .15s ease;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .project:hover, .project:focus-visible { transform: scale(1.03); }
  .project:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .project img {
    display: block;
    width: 100%;
    height: auto;
  }

  .p1 { grid-area: p1; align-self: end; }
  .p2 { grid-area: p2; align-self: end; }
  .p3 { grid-area: p3; align-self: start; }
  .p4 { grid-area: p4; align-self: start; }

  /* ---------- Hero ---------- */
  .hero {
    grid-area: hero;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .pfp {
    display: block;
    width: 210px;
    height: auto;
  }

  .name-wrap { font-size: 0; line-height: 0; }

  .name {
    display: block;
    max-width: 100%;
    height: auto;
  }

  .about {
    display: block;
    width: 100%;
    height: auto;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.2rem;
    margin-top: .5rem;
  }

  .buttons a {
    display: block;
    border-radius: 999px;
    transition: transform .15s ease;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .buttons a:hover, .buttons a:focus-visible { transform: scale(1.06); }
  .buttons a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .buttons img { display: block; height: 130px; width: auto; }

  /* ---------- Mobile / tablet ---------- */
  @media (max-width: 900px) {
    .page {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "hero hero"
        "p1 p2"
        "p3 p4";
      align-items: start;
      padding-top: 2rem;
    }
    .p1, .p2, .p3, .p4 { align-self: start; }
    .pfp { width: 160px; }
  }

  @media (max-width: 520px) {
    .page {
      grid-template-columns: 1fr;
      grid-template-areas: "hero" "p1" "p2" "p3" "p4";
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ---------- Loading screen ---------- */
  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b1f33;
    color: #fff;
    font-size: 2.2rem;
    letter-spacing: .05em;
    transition: opacity .4s ease;
  }

  #loadingScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  body.is-loading {
    overflow: hidden;
  }

  /* ---------- Music player ---------- */
  .music-player {
    position: fixed;
    right: 1.2rem;
    bottom: 1.2rem;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .5rem .9rem .5rem .5rem;
    border-radius: 999px;
    background: linear-gradient(145deg, var(--blue-edge), var(--blue-deep));
    box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
  }

  .music-toggle {
    width: 44px;
    height: 44px;
    flex: none;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: var(--blue-deep);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  .music-toggle img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform: scale(0.25);
  }

  .music-label {
    font-size: 1.2rem;
    color: #fff;
    white-space: nowrap;
  }

  .music-credit {
    text-align: center;
    font-size: 1.1rem;
    color: var(--ink);
    opacity: .75;
    padding: 1rem 1rem 6.5rem;
  }

  /* ---------- Code viewer modal ---------- */
  .code-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: rgba(0, 0, 0, .6);
  }

  .code-overlay.open { display: flex; }

  .code-box {
    width: 100%;
    max-width: 780px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    overflow: hidden;
    background: #0b1f33;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }

  .code-box-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .8rem 1.2rem;
    background: var(--blue-deep);
  }

  .code-box-header span {
    color: #fff;
    font-size: 1.3rem;
  }

  .code-close {
    border: none;
    background: #fff;
    color: var(--blue-deep);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .code-box-actions {
    display: flex;
    align-items: center;
    gap: .8rem;
  }

  .code-copy {
    border: none;
    background: #fff;
    color: var(--blue-deep);
    padding: .4rem .9rem;
    border-radius: 999px;
    font-family: "VT323", monospace;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .gallery-box {
    width: 100%;
    max-width: 640px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    border-radius: 18px;
    overflow: hidden;
    background: #0b1f33;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    padding: 1.2rem;
    overflow: auto;
  }

  .gallery-grid button {
    padding: 0;
    border: none;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    background: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease;
  }

  .gallery-grid button:hover,
  .gallery-grid button:focus-visible {
    transform: scale(1.04);
  }

  .gallery-grid img {
    display: block;
    width: 100%;
    height: auto;
  }

  .code-box pre {
    margin: 0;
    padding: 1.2rem;
    overflow: auto;
    color: #d8e8f5;
    font-family: "Courier New", monospace;
    font-size: 1rem;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body class="is-loading">
  <div id="loadingScreen">Loading..</div>

  <main class="page">

    <a class="project p1" href="#" aria-label="Project 1" data-code="codes/code1.txt">
      <img src="images/project1.png" alt="Project 1">
    </a>
    <a class="project p2" href="#" aria-label="Project 2" data-code="codes/code2.txt">
      <img src="images/project2.png" alt="Project 2">
    </a>
    <a class="project p3" href="#" aria-label="Project 3" data-code="codes/code3.txt">
      <img src="images/project3.png" alt="Project 3">
    </a>
    <a class="project p4" href="#" aria-label="Project 4" data-code="codes/code4.txt">
      <img src="images/project4.png" alt="Project 4">
    </a>

    <section class="hero">
      <img class="pfp" src="images/pfp.png" alt="TailsPlaysBloxd profile picture">
      <h1 class="name-wrap"><img class="name" src="images/name.png" alt="TailsPlaysBloxd"></h1>

      <img class="about" src="images/about.png" alt="About me">

      <div class="buttons">
        <a href="https://github.com/uhwhatamityping/" target="_blank" rel="noopener" aria-label="See GitHub">
          <img src="images/see-github.png" alt="See GitHub">
        </a>
        <a href="#" id="seeCodesBtn" aria-label="See codes">
          <img src="images/see-codes.png" alt="See codes">
        </a>
      </div>
    </section>

  </main>

  <p class="music-credit">Thank you to DJARTMUSIC for the background music 🎵</p>

  <div class="music-player">
    <button class="music-toggle" id="musicToggle" aria-label="Play music" type="button"><img src="images/play.png" alt=""></button>
    <span class="music-label" id="musicLabel">Play music</span>
  </div>
  <audio id="bgMusic" src="song.mp3" loop></audio>

  <div class="code-overlay" id="galleryOverlay">
    <div class="gallery-box">
      <div class="code-box-header">
        <span>Select a project</span>
        <button class="code-close" id="galleryClose" aria-label="Close" type="button">&#10005;</button>
      </div>
      <div class="gallery-grid">
        <button type="button" data-code="codes/code1.txt"><img src="images/project1.png" alt="Project 1"></button>
        <button type="button" data-code="codes/code2.txt"><img src="images/project2.png" alt="Project 2"></button>
        <button type="button" data-code="codes/code3.txt"><img src="images/project3.png" alt="Project 3"></button>
        <button type="button" data-code="codes/code4.txt"><img src="images/project4.png" alt="Project 4"></button>
      </div>
    </div>
  </div>

  <div class="code-overlay" id="codeOverlay">
    <div class="code-box">
      <div class="code-box-header">
        <span id="codeTitle">Code</span>
        <div class="code-box-actions">
          <button class="code-copy" id="codeCopy" type="button">Copy code</button>
          <button class="code-close" id="codeClose" aria-label="Close" type="button">&#10005;</button>
        </div>
      </div>
      <pre id="codeContent">Loading...</pre>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      const loadingScreen = document.getElementById('loadingScreen');
      document.body.classList.remove('is-loading');
      loadingScreen.classList.add('hidden');
      setTimeout(() => { loadingScreen.remove(); }, 500);
    });

    const codeOverlay = document.getElementById('codeOverlay');
    const codeContent = document.getElementById('codeContent');
    const codeTitle = document.getElementById('codeTitle');
    const codeClose = document.getElementById('codeClose');
    const codeCopy = document.getElementById('codeCopy');

    codeCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(codeContent.textContent);
        const original = codeCopy.textContent;
        codeCopy.textContent = 'Copied!';
        setTimeout(() => { codeCopy.textContent = original; }, 1500);
      } catch (err) {
        codeCopy.textContent = 'Could not copy';
      }
    });

    async function openCodeViewer(path, titleText) {
      codeTitle.textContent = titleText;
      codeContent.textContent = 'Loading...';
      codeOverlay.classList.add('open');
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error('not found');
        codeContent.textContent = await res.text();
      } catch (err) {
        codeContent.textContent = 'Could not load ' + path + '. Make sure the file exists.';
      }
    }

    document.querySelectorAll('.project[data-code]').forEach((link, i) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        openCodeViewer(link.getAttribute('data-code'), 'Project ' + (i + 1));
      });
    });

    function closeCodeViewer() {
      codeOverlay.classList.remove('open');
    }
    codeClose.addEventListener('click', closeCodeViewer);
    codeOverlay.addEventListener('click', (e) => {
      if (e.target === codeOverlay) closeCodeViewer();
    });

    const galleryOverlay = document.getElementById('galleryOverlay');
    const galleryClose = document.getElementById('galleryClose');
    const seeCodesBtn = document.getElementById('seeCodesBtn');

    seeCodesBtn.addEventListener('click', (e) => {
      e.preventDefault();
      galleryOverlay.classList.add('open');
    });

    function closeGallery() {
      galleryOverlay.classList.remove('open');
    }
    galleryClose.addEventListener('click', closeGallery);
    galleryOverlay.addEventListener('click', (e) => {
      if (e.target === galleryOverlay) closeGallery();
    });

    document.querySelectorAll('.gallery-grid button[data-code]').forEach((btn, i) => {
      btn.addEventListener('click', () => {
        closeGallery();
        openCodeViewer(btn.getAttribute('data-code'), 'Project ' + (i + 1));
      });
    });

    const audio = document.getElementById('bgMusic');
    const toggle = document.getElementById('musicToggle');
    const label = document.getElementById('musicLabel');

    toggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    });

    const toggleIcon = toggle.querySelector('img');

    audio.addEventListener('play', () => {
      toggleIcon.src = 'images/pause.png';
      toggle.setAttribute('aria-label', 'Pause music');
      label.textContent = 'Playing';
    });

    audio.addEventListener('pause', () => {
      toggleIcon.src = 'images/play.png';
      toggle.setAttribute('aria-label', 'Play music');
      label.textContent = 'Play music';
    });
  </script>
</body>
</html>
