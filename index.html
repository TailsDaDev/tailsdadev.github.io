<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TailsPlaysBloxd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #25a5e6;
    --blue-deep: #1b7fc4;
    --blue-edge: #3aa0e8;
    --ink: #0b1f33;
    --title: #4fc3f7;
    --sky: #c9d8e4;
    --grass: #9bbf4a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: "VT323", "Courier New", monospace;
    color: var(--ink);
    background: url("images/bg.png") center / cover no-repeat fixed;
    min-height: 100vh;
  }

  .page {
    max-width: 1280px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: 1fr minmax(0, 1.3fr) 1fr;
    grid-template-areas:
      "p1 hero p2"
      "p3 hero p4";
    column-gap: 2.5rem;
    row-gap: 2rem;
    align-items: center;
  }

  /* ---------- Project cards ---------- */
  .project {
    display: block;
    transition: transform .15s ease;
  }
  .project:hover, .project:focus-visible { transform: scale(1.03); }
  .project:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  .project img {
    display: block;
    width: 100%;
    height: auto;
  }

  .p1 { grid-area: p1; align-self: end; }
  .p2 { grid-area: p2; align-self: end; }
  .p3 { grid-area: p3; align-self: start; }
  .p4 { grid-area: p4; align-self: start; }

  /* ---------- Hero ---------- */
  .hero {
    grid-area: hero;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .pfp {
    display: block;
    width: 210px;
    height: auto;
  }

  .name-wrap { font-size: 0; line-height: 0; }

  .name {
    display: block;
    max-width: 100%;
    height: auto;
  }

  .about {
    display: block;
    width: 100%;
    height: auto;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.2rem;
    margin-top: .5rem;
  }

  .buttons a {
    display: block;
    border-radius: 999px;
    transition: transform .15s ease;
  }
  .buttons a:hover, .buttons a:focus-visible { transform: scale(1.06); }
  .buttons a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .buttons img { display: block; height: 64px; width: auto; }

  /* ---------- Mobile / tablet ---------- */
  @media (max-width: 900px) {
    .page {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "hero hero"
        "p1 p2"
        "p3 p4";
      align-items: start;
      padding-top: 2rem;
    }
    .p1, .p2, .p3, .p4 { align-self: start; }
    .pfp { width: 160px; }
  }

  @media (max-width: 520px) {
    .page {
      grid-template-columns: 1fr;
      grid-template-areas: "hero" "p1" "p2" "p3" "p4";
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="page">

    <a class="project p1" href="#" aria-label="Project 1">
      <img src="images/project1.png" alt="Project 1">
    </a>
    <a class="project p2" href="#" aria-label="Project 2">
      <img src="images/project2.png" alt="Project 2">
    </a>
    <a class="project p3" href="#" aria-label="Project 3">
      <img src="images/project3.png" alt="Project 3">
    </a>
    <a class="project p4" href="#" aria-label="Project 4">
      <img src="images/project4.png" alt="Project 4">
    </a>

    <section class="hero">
      <img class="pfp" src="images/pfp.png" alt="TailsPlaysBloxd profile picture">
      <h1 class="name-wrap"><img class="name" src="images/name.png" alt="TailsPlaysBloxd"></h1>

      <img class="about" src="images/about.png" alt="About me">

      <div class="buttons">
        <a href="https://github.com/uhwhatamityping/" target="_blank" rel="noopener" aria-label="See GitHub">
          <img src="images/see-github.png" alt="See GitHub">
        </a>
        <a href="#" aria-label="See codes">
          <img src="images/see-codes.png" alt="See codes">
        </a>
      </div>
    </section>

  </main>
</body>
</html>
